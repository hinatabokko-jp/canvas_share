<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Canvas Share</title>
  <style>
    body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; margin: 0; padding: 0; }
    .screen { display: none; height: 100vh; width: 100vw; box-sizing: border-box; }
    .active { display: flex; }
    /* ダークモード向け基本スタイル */
    input, button, select { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; }
    button { cursor: pointer; }
    button:hover { background: #3a3a3a; }
  </style>
</head>
<body>

  <!-- 1. ログイン画面 -->
  <div id="login-screen" class="screen active" style="justify-content:center; align-items:center; gap:40px;">
    <!-- User1 ログイン -->
    <div style="background:#1e1e1e; padding:30px; border-radius:8px; width:300px;">
      <h2>User 1</h2>
      <label>ユーザー名</label><br>
      <input type="text" id="u1-name" style="width:100%; margin-bottom:10px;"><br>
      <label>パスワード</label><br>
      <input type="password" id="u1-pass" style="width:100%; margin-bottom:10px;"><br>
      <label><input type="checkbox" id="u1-auto"> 次回から自動ログイン</label><br><br>
      <button onclick="login('user1')" style="width:100%; background:#0d6efd; color:#fff;">入室する</button>
    </div>

    <!-- User2 ログイン -->
    <div style="background:#1e1e1e; padding:30px; border-radius:8px; width:300px;">
      <h2>User 2</h2>
      <label>ユーザー名</label><br>
      <input type="text" id="u2-name" style="width:100%; margin-bottom:10px;"><br>
      <label>パスワード</label><br>
      <input type="password" id="u2-pass" style="width:100%; margin-bottom:10px;"><br>
      <label><input type="checkbox" id="u2-auto"> 次回から自動ログイン</label><br><br>
      <button onclick="login('user2')" style="width:100%; background:#198754; color:#fff;">入室する</button>
    </div>

    <!-- 招待用モーダル呼び出し＆新規登録ボタン等 -->
    <div style="position:absolute; bottom:20px; display:flex; gap:10px;">
      <button onclick="openInviteModal()">招待QRコード表示</button>
      <button onclick="showScreen('register-screen')">新規ユーザー登録</button>
    </div>
  </div>

  <!-- 2. 新規ユーザー登録画面 -->
  <div id="register-screen" class="screen" style="justify-content:center; align-items:center;">
    <div style="background:#1e1e1e; padding:30px; border-radius:8px; width:300px;">
      <h2>新規ユーザー登録</h2>
      <label>ユーザー名</label><br>
      <input type="text" id="reg-name" style="width:100%; margin-bottom:10px;"><br>
      <label>パスワード</label><br>
      <input type="password" id="reg-pass" style="width:100%; margin-bottom:15px;"><br>
      <button onclick="registerUser()" style="width:100%; margin-bottom:10px;">登録</button>
      <button onclick="showScreen('login-screen')" style="width:100%; background:transparent;">ログイン画面へ</button>
    </div>
  </div>

  <!-- 3. 管理画面 (master / 0813) -->
  <div id="admin-screen" class="screen" style="flex-direction:column; padding:30px;">
    <h2>管理画面（ユーザー管理）</h2>
    <div id="user-list-container" style="background:#1e1e1e; padding:20px; border-radius:8px; margin-top:20px; max-width:600px;"></div>
    <button onclick="showScreen('login-screen')" style="margin-top:20px; width:150px;">ログアウト</button>
  </div>

  <!-- 4. 描画メイン画面 -->
  <div id="main-screen" class="screen" style="display:flex; justify-content:space-between; padding:10px; gap:10px;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
      <h3>User 1 エリア</h3>
      <canvas id="canvas1" width="400" height="500" style="background:#222; border:1px solid #444;"></canvas>
    </div>
    
    <!-- 中央ツールバーなど -->
    <div style="display:flex; flex-direction:column; justify-content:center; gap:10px;">
      <button onclick="triggerReflect()">描き終わった</button>
      <button onclick="openBrushModal()">ブラシ設定</button>
      <button onclick="undo()">← 戻る</button>
      <button onclick="redo()">やりなおし →</button>
      <button onclick="saveArtwork()">保存する</button>
      <button onclick="openHistory()">履歴を見る</button>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
      <h3>User 2 エリア</h3>
      <canvas id="canvas2" width="400" height="500" style="background:#222; border:1px solid #444;"></canvas>
    </div>

    <!-- レイヤー制御ウィンドウ（右側縦長） -->
    <div id="layer-container"></div>
  </div>

  <!-- 招待用QRコードモーダル -->
  <div id="invite-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:2000;">
    <div style="background:#1e1e1e; padding:30px; border-radius:8px; text-align:center;">
      <h3>お友達を招待する</h3>
      <!-- 簡易QR画像（APIを利用） -->
      <img id="qr-code-img" src="" alt="QR Code" style="margin:15px 0; background:#fff; padding:10px; border-radius:4px;"><br>
      <p id="invite-url-text" style="font-size:14px; color:#aaa; user-select:all;"></p>
      <button onclick="closeInviteModal()" style="margin-top:15px;">閉じる</button>
    </div>
  </div>

  <script type="module">
    import { DrawingManager } from './drawing.js';
    import { LayerManager } from './layers.js';
    import { StorageManager } from './storage.js';

    let drawer1, drawer2, layerManager, storageManager;

    window.addEventListener('DOMContentLoaded', () => {
      drawer1 = new DrawingManager('canvas1');
      drawer2 = new DrawingManager('canvas2');
      layerManager = new LayerManager('layer-container');
      storageManager = new StorageManager();
    });

    window.showScreen = function(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    };

    window.login = function(userType) {
      const name = document.getElementById(userType === 'user1' ? 'u1-name' : 'u2-name').value;
      const pass = document.getElementById(userType === 'user1' ? 'u1-pass' : 'u2-pass').value;

      // 管理者ログイン判定
      if (name === 'master' && pass === '0813') {
        showScreen('admin-screen');
        loadUserList();
        return;
      }

      // 通常入室
      showScreen('main-screen');
    };

    window.openInviteModal = function() {
      const url = "https://hinatabokko-jp.github.io/hinatabokko-app2/page31.html";
      document.getElementById('invite-url-text').innerText = url;
      document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}`;
      document.getElementById('invite-modal').style.display = 'flex';
    };

    window.closeInviteModal = function() {
      document.getElementById('invite-modal').style.display = 'none';
    };

    window.triggerReflect = function() {
      alert('「描き終わった」ボタンが押されました。お互いの画面に反映します！');
    };

    window.saveArtwork = function() {
      const dataUrl = document.getElementById('canvas1').toDataURL();
      storageManager.saveArtwork(dataUrl, 'みんなの絵');
      alert('作品を保存しました！');
    };

    window.openHistory = function() {
      storageManager.renderHistoryModal('main-screen', () => {
        // 閉じる時の処理
      });
    };

    window.undo = function() { drawer1.undo(); }
    window.redo = function() { drawer1.redo(); }
  </script>
</body>
</html>
